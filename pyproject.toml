[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ph-control-release"
version = "0.2.0"
description = "Deployable particle-filter and PPO controllers for simulated pH adjustment"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "torch==2.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["controllers*", "training*"]

[tool.setuptools.package-data]
controllers = ["models/*.pth", "models/*.npz", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
